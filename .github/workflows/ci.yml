# Report-only: a red run flags a problem but blocks nothing. Vercel deploys on
# its own, and this check is not required by any branch rule.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - id: install
        run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # Run the tests even if lint failed, so one run reports both.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test
